<!doctype html>
<html lang="ru" data-theme="{{ ui_theme }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#59171b">
    <title>{% block title %}Smart Study{% endblock %} · Smart Study</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block layout %}
<main class="auth__panel" style="min-height:100vh;">
    <div style="width:100%;max-width:460px;">
        {% include "_flashes.html" %}
        {% block content %}{% endblock %}
    </div>
</main>
{% endblock %}
<script src="{{ url_for('static', filename='js/logo.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
